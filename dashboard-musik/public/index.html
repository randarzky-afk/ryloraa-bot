        <div id="toasts"></div>

        <script>
            const $ = (id) => document.getElementById(id);

            // Helper untuk getar di HP (mencegah warning di PC)
            const vibrate = (ms) => {
                try {
                    if (
                        "vibrate" in navigator &&
                        window.matchMedia("(pointer: coarse)").matches
                    ) {
                        navigator.vibrate(ms);
                    }
                } catch {}
            };
            const esc = (s) =>
                String(s ?? "").replace(
                    /[&<>"']/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                            "'": "&#39;",
                        })[c],
                );
            const fmt = (ms) => {
                if (!ms || ms < 0 || !isFinite(ms)) return "0:00";
                const s = Math.floor(ms / 1000);
                return (
                    Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0")
                );
            };
            const SRC = {
                music: "MUSIK",
                youtube: "YOUTUBE",
                spotify: "SPOTIFY",
                lyric: "LIRIK",
            };
            const LOOPN = ["Loop mati", "Ulangi 1 lagu", "Ulangi antrian"];

            // ================= IKON =================
            const S = (p, w = 22) =>
                `<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
            const F = (p, w = 22) =>
                `<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="currentColor" aria-hidden="true">${p}</svg>`;
            const REPEAT =
                '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>';
            const ICON = {
                play: F(
                    '<path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/>',
                    20,
                ),
                pause: F(
                    '<rect x="6" y="4" width="4.5" height="16" rx="1.2"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2"/>',
                    20,
                ),
                skip: F(
                    '<path d="M5 4.5v15a1 1 0 0 0 1.5.86l10-7.5a1 1 0 0 0 0-1.72l-10-7.5A1 1 0 0 0 5 4.5z"/><rect x="18" y="4" width="2.6" height="16" rx="1.1"/>',
                ),
                auto: S(
                    '<path d="M18.18 8c5.1 0 5.1 8 0 8-5.1 0-7.14-8-12.74-8-4.59 0-4.59 8 0 8 5.6 0 7.64-8 12.74-8z"/>',
                ),
                loop: [
                    S(REPEAT),
                    S(REPEAT + '<path d="M11 10h1v4"/>'),
                    S(REPEAT),
                ],
                plus: S('<path d="M12 5v14M5 12h14"/>', 16),
                grip: F(
                    '<circle cx="9" cy="5" r="1.6"/><circle cx="15" cy="5" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="19" r="1.6"/><circle cx="15" cy="19" r="1.6"/>',
                    18,
                ),
                search: S(
                    '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
                    20,
                ),
                clear: S('<path d="M18 6 6 18M6 6l12 12"/>', 18),
                // 👇 Ikon X diganti menjadi Ikon Tempat Sampah (Trash)
                x: S(
                    '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>',
                    16,
                ),
            };
            $("skip").innerHTML = ICON.skip;
            $("auto").innerHTML = ICON.auto;
            $("seBtn").innerHTML = ICON.search;
            $("clearBtn").innerHTML = ICON.clear;

            async function api(url, body, method) {
                const r = await fetch(
                    url,
                    body === undefined
                        ? {}
                        : {
                              method: method || "POST",
                              headers: { "Content-Type": "application/json" },
                              body: JSON.stringify(body),
                          },
                );
                if (r.status === 401) return location.reload();
                const d = await r.json().catch(() => ({}));
                if (!r.ok)
                    throw Object.assign(
                        new Error(d.error || "Terjadi kesalahan"),
                        {
                            status: r.status,
                        },
                    );
                return d;
            }
            function toast(msg, type) {
                const t = document.createElement("div");
                // type bisa berupa: true (error merah), "warn" (kuning), atau undefined (biasa)
                t.className =
                    "toast" +
                    (type === true ? " err" : type === "warn" ? " warn" : "");
                t.textContent = msg;
                $("toasts").appendChild(t);

                // batasi tumpukan: tidak boleh naik melewati setengah layar (yang paling lama dibuang)
                const box = $("toasts");
                while (
                    box.children.length > 1 &&
                    box.getBoundingClientRect().top < window.innerHeight / 2
                )
                    box.firstElementChild.remove();

                // 👇 Trigger transisi slide up setelah elemen masuk ke DOM
                requestAnimationFrame(() => {
                    t.classList.add("show");
                });

                // 👇 Hilangkan perlahan setelah 3.2 detik, lalu hapus dari DOM
                setTimeout(() => {
                    t.classList.remove("show");
                    setTimeout(() => t.remove(), 350); // Tunggu transisi selesai
                }, 3200);
            }

            // ================= STATE =================
            let track = null,
                dur = 0,
                paused = false,
                loopMode = 0,
                autoplay = false;
            let anchor = { pos: 0, t: performance.now() }; // posisi lagu saat anchor dibuat
            let barColor = null,
                uid = "anon",
                recent = [],
                recentOpen = false;
            let scrubbing = false,
                scrubPos = 0,
                holdUntil = 0,
                queueSig = null,
                qData = [],
                dragging = false,
                pendingDrag = false;

            const now = () =>
                paused
                    ? anchor.pos
                    : Math.min(
                          dur || Infinity,
                          anchor.pos + performance.now() - anchor.t,
                      );
            const setAnchor = (pos) => {
                anchor = { pos, t: performance.now() };
            };

            // ================= FAVICON (logo bot) =================
            // Isi BOT_LOGO dengan URL/path logo botmu, ATAU kirim `botAvatar` dari /api/me di server
            // (otomatis dipakai). Kalau dua-duanya kosong, dipakai logo Discord bawaan di <head>.
            const BOT_LOGO = "";
            let customIcon = false;
            function setFavicon(url) {
                if (!url) return;
                customIcon = true;
                $("favicon").removeAttribute("type");
                $("favicon").href = url;
                $("touchicon").href = url;
            }
            setFavicon(BOT_LOGO);
            (() => {
                const im = new Image();
                im.onload = () => {
                    try {
                        const c = document.createElement("canvas");
                        c.width = c.height = 180;
                        c.getContext("2d").drawImage(im, 0, 0, 180, 180);
                        if (!customIcon)
                            $("touchicon").href = c.toDataURL("image/png");
                    } catch {}
                };
                im.src = $("favicon").href;
            })();

            // ================= INIT =================
            (async () => {
                const me = await fetch("/api/me").then((r) => r.json());
                setFavicon(me.botAvatar || (me.bot && me.bot.avatar) || "");
                if (!me.loggedIn) {
                    $("userBox").innerHTML =
                        '<a class="btn" href="/auth/discord">Login dengan Discord</a>';
                    return;
                }
                $("userBox").innerHTML =
                    `<div class="user"><img src="${esc(me.avatar)}" alt=""><span>${esc(me.username)}</span><a class="btn red" href="/auth/logout">Logout</a></div>`;
                $("main").style.display = "block";
                uid = me.id || "anon";
                loadRecent();
                $("dock").classList.add("show");
                document.body.classList.add("has-dock");
                setIdle("Menghubungkan ke bot…");
                loadQueue();
                setInterval(loadQueue, 1500);
                loadDJ();
                setInterval(loadDJ, 3000);
                requestAnimationFrame(frame);
            })();

            // ================= WARNA PROGRESS BAR (dari cover art) =================
            function tint(hex) {
                const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(
                    hex || "",
                );
                if (!m) return "#fff";
                const [r, g, b] = m.slice(1).map((v) => parseInt(v, 16) / 255);
                const mx = Math.max(r, g, b),
                    mn = Math.min(r, g, b);
                let h = 0,
                    s = 0,
                    l = (mx + mn) / 2;
                if (mx !== mn) {
                    const d = mx - mn;
                    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
                    h =
                        (mx === r
                            ? (g - b) / d + (g < b ? 6 : 0)
                            : mx === g
                              ? (b - r) / d + 2
                              : (r - g) / d + 4) * 60;
                }
                l = Math.max(0.62, Math.min(0.8, l));
                s = Math.min(s, 0.85); // terang cukup supaya jelas di atas bar gelap
                return `hsl(${Math.round(h)} ${Math.round(s * 100)}% ${Math.round(l * 100)}%)`;
            }
            let reqShown = null;
            function setBarColor(hex) {
                if (hex === barColor) return;
                barColor = hex;
                $("dock").style.setProperty("--np", hex ? tint(hex) : "#fff");
            }

            // ================= PROGRESS BAR =================
            function frame() {
                if (track) {
                    const p = scrubbing ? scrubPos : now();
                    $("fill").style.width =
                        (dur ? Math.min(100, (p / dur) * 100) : 0) + "%";
                    $("cur").textContent = fmt(p);
                    $("pbar").setAttribute(
                        "aria-valuenow",
                        Math.floor(p / 1000),
                    );
                }
                requestAnimationFrame(frame);
            }
            const bar = $("pbar");
            const posFrom = (e) => {
                const r = bar.getBoundingClientRect();
                return (
                    Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) *
                    dur
                );
            };
            const showTip = (e) => {
                const r = bar.getBoundingClientRect();
                const x = Math.max(0, Math.min(r.width, e.clientX - r.left));
                $("tip").style.left = x + "px";
                $("tip").textContent = fmt((x / r.width) * dur);
            };
            bar.addEventListener("pointerdown", (e) => {
                if (!dur) return;
                bar.setPointerCapture(e.pointerId);
                scrubbing = true;
                bar.classList.add("drag");
                scrubPos = posFrom(e);
                showTip(e);
            });
            bar.addEventListener("pointermove", (e) => {
                showTip(e);
                if (scrubbing) scrubPos = posFrom(e);
            });
            bar.addEventListener("pointerup", (e) => {
                if (!scrubbing) return;
                scrubbing = false;
                bar.classList.remove("drag");
                seek(posFrom(e));
            });
            bar.addEventListener("pointercancel", () => {
                scrubbing = false;
                bar.classList.remove("drag");
            });
            bar.addEventListener("keydown", (e) => {
                const d = { ArrowRight: 5000, ArrowLeft: -5000 }[e.key];
                if (!d || !dur) return;
                e.preventDefault();
                seek(Math.max(0, Math.min(dur - 1000, now() + d)));
            });
            function seek(ms) {
                ms = Math.floor(Math.max(0, Math.min(ms, dur - 1000)));
                setAnchor(ms);
                holdUntil = Date.now() + 3000;
                api("/api/control", { action: "seek", value: ms }).catch(
                    (e) => {
                        toast(e.message, 1);
                        holdUntil = 0;
                        loadQueue();
                    },
                );
            }

            // ================= KONTROL: jeda, lewati, autoplay, loop =================
            const ctl = (action, value) =>
                api("/api/control", { action, value });

            function setPaused(p) {
                paused = p;
                $("pp").innerHTML = p ? ICON.play : ICON.pause;
                $("pp").setAttribute("aria-label", p ? "Putar" : "Jeda");
                $("dock").classList.toggle("playing", !p);
            }
            function drawLoop() {
                const b = $("loop");
                if (b.dataset.m !== String(loopMode)) {
                    b.dataset.m = loopMode;
                    b.innerHTML = ICON.loop[loopMode];
                }
                b.classList.toggle("on", loopMode > 0);
                b.title = LOOPN[loopMode];
                b.setAttribute("aria-pressed", loopMode > 0);
            }
            function drawAuto() {
                const b = $("auto");
                b.classList.toggle("on", autoplay);
                b.setAttribute("aria-pressed", autoplay);
                b.title = autoplay ? "Autoplay nyala" : "Autoplay mati";
            }
            setPaused(false);
            drawLoop();
            drawAuto();

            // Kondisi "tidak ada lagu": bar tetap tampil tapi tombol nonaktif
            function setIdle(msg) {
                track = null;
                dur = 0;
                setPaused(true);
                $("dock").classList.add("idle");
                ["pp", "skip", "auto", "loop"].forEach(
                    (id) => ($(id).disabled = true),
                );
                $("title").textContent = "Belum ada lagu yang diputar";
                $("author").textContent =
                    msg || "Cari lagu di atas lalu tekan Putar";
                $("reqby").style.display = "none";
                reqShown = null;
                $("cover").style.display = "none";
                $("coverPh").style.display = "";
                $("cur").textContent = "0:00";
                $("tot").textContent = "0:00";
                $("fill").style.width = "0%";
                $("bg").style.backgroundImage = "none";
                setBarColor(null);
            }
            function showStatus(msg) {
                const b = $("qstatus");
                b.textContent = msg || "";
                b.style.display = msg ? "block" : "none";
            }
            const friendly = (m) =>
                /voice channel/i.test(m || "")
                    ? "Kamu belum ada di voice channel. Masuk ke voice channel Discord dulu supaya dashboard bisa mengontrol bot."
                    : m || "Tidak bisa terhubung ke bot.";

            $("pp").onclick = () => {
                setAnchor(now());
                setPaused(!paused);
                holdUntil = Date.now() + 2500;
                ctl(paused ? "pause" : "resume").catch((e) => {
                    toast(e.message, 1);
                    holdUntil = 0;
                    loadQueue();
                });
            };
            $("skip").onclick = () => {
                holdUntil = Date.now() + 2500;
                if (paused) setPaused(false); // server akan auto-resume saat skip
                api("/api/skip", {})
                    .then(() => {
                        queueSig = null;
                        setTimeout(loadQueue, 400);
                    })
                    .catch((e) => toast(e.message, 1));
            };
            $("loop").onclick = () => {
                const prev = loopMode;
                loopMode = (loopMode + 1) % 3;
                drawLoop();
                holdUntil = Date.now() + 2500;
                toast(LOOPN[loopMode]);
                ctl("loop", loopMode).catch((e) => {
                    loopMode = prev;
                    drawLoop();
                    toast(e.message, 1);
                });
            };
            $("auto").onclick = () => {
                autoplay = !autoplay;
                drawAuto();
                holdUntil = Date.now() + 2500;
                if (!qData.length) renderQueue();
                toast(
                    autoplay
                        ? "Autoplay nyala — lagu mirip akan ditambahkan otomatis"
                        : "Autoplay mati",
                );
                ctl("autoplay", autoplay)
                    .then(() => {
                        queueSig = null;
                        setTimeout(loadQueue, 1200);
                    })
                    .catch((e) => {
                        autoplay = !autoplay;
                        drawAuto();
                        toast(e.message, 1);
                    });
            };

            document.addEventListener("keydown", (e) => {
                const typing = /INPUT|TEXTAREA/.test(
                    document.activeElement.tagName,
                );
                if (e.key === "/" && !typing) {
                    e.preventDefault();
                    $("q").focus();
                }
                if (
                    e.code === "Space" &&
                    !typing &&
                    track &&
                    document.activeElement !== bar &&
                    !/BUTTON/.test(document.activeElement.tagName)
                ) {
                    e.preventDefault();
                    $("pp").click();
                }
            });

            // ================= DJ =================
            // Ikon CDJ: body deck + jog wheel besar + layar kecil + tombol
            const CDJ = S(
                // Bodi deck
                '<rect x="1.5" y="1.5" width="21" height="21" rx="3" stroke-width="1.6"/>' +
                    // Layar
                    '<rect x="4" y="3.8" width="16" height="4.6" rx="1" stroke-width="1.2"/>' +
                    // Waveform di layar
                    '<path d="M6 5.9v.4M8 5.2v1.8M10 4.9v2.4M12 5.4v1.4M14 4.9v2.4M16 5.2v1.8M18 5.9v.4" stroke-width="1"/>' +
                    // Jog wheel
                    '<circle cx="13" cy="15.3" r="5.3" stroke-width="1.6"/>' +
                    '<circle cx="13" cy="15.3" r="3.2" stroke-width=".8"/>' +
                    '<circle cx="13" cy="15.3" r=".9" fill="currentColor" stroke="none"/>' +
                    // Penanda putar jog
                    '<path d="M13 10.9v1.6" stroke-width="1.6"/>' +
                    // Tombol Cue + Play
                    '<circle cx="4.9" cy="12.3" r="1.3" stroke-width="1.2"/>' +
                    '<path d="M3.7 15.4v3.4l2.9-1.7z" fill="currentColor" stroke-width="1"/>' +
                    // Fader tempo
                    '<path d="M20.5 10.5v10" stroke-width="1"/>' +
                    '<rect x="19.4" y="13.8" width="2.2" height="3.2" rx=".5" fill="currentColor" stroke-width=".6"/>',
            );

            let djState = {
                supported: false,
                dj: null,
                isDJ: false,
                canClaim: false,
                hasTrack: false,
                access: {
                    locked: false,
                    request: true,
                    control: true,
                    queue: true,
                },
            };

            function drawDJ() {
                const s = djState,
                    d = s.dj,
                    b = $("dj");
                const name = d ? d.displayName || d.username : "";

                // isi tombol: foto DJ kalau ada, kalau tidak ikon headphone
                const key = d && d.avatar ? d.avatar : "icon";
                if (b.dataset.k !== key) {
                    b.dataset.k = key;
                    b.innerHTML =
                        d && d.avatar
                            ? `<img src="${esc(d.avatar)}" alt="">`
                            : CDJ;
                }
                b.disabled = !s.supported;
                const ac = s.access || {};
                document.body.classList.toggle(
                    "lock-request",
                    ac.request === false,
                );
                document.body.classList.toggle(
                    "lock-control",
                    ac.control === false,
                );
                document.body.classList.toggle(
                    "lock-queue",
                    ac.queue === false,
                );
                b.classList.toggle("mine", s.isDJ);
                b.classList.toggle("can", s.canClaim);
                b.setAttribute("aria-pressed", s.isDJ);
                b.title = !s.supported
                    ? "Fitur DJ aktif setelah bot di-restart"
                    : s.isDJ
                      ? "Lepas DJ"
                      : d
                        ? `DJ saat ini: ${name}`
                        : s.canClaim
                          ? "Ambil DJ"
                          : s.hasTrack
                            ? "Cuma peminta lagu yang sedang diputar yang bisa ambil DJ"
                            : "Putar lagu dulu untuk ambil DJ";

                // profil DJ di sisi kanan bar
                $("djbox").classList.toggle("show", !!d);
                if (d) {
                    if ($("djImg").getAttribute("src") !== (d.avatar || ""))
                        $("djImg").src = d.avatar || "";
                    // $("djName").textContent = name; // dihilangkan
                    $("djSub").textContent = `DJ · @${d.username}`;
                }
            }

            async function loadDJ() {
                try {
                    const d = await api("/api/dj");
                    if (!d) return;
                    djState = {
                        supported: d.supported !== false,
                        dj: d.dj || null,
                        isDJ: !!d.isDJ,
                        canClaim: !!d.canClaim,
                        hasTrack: !!d.hasTrack,
                        access: d.access || {
                            locked: false,
                            request: true,
                            control: true,
                            queue: true,
                        },
                    };
                } catch (e) {
                    return;
                }
                drawDJ();
            }

            $("dj").onclick = async () => {
                const s = djState;
                try {
                    if (s.isDJ) {
                        await api("/api/dj/release", {});
                        toast("DJ dilepas");
                    } else if (s.canClaim) {
                        await api("/api/dj/claim", {});
                        toast("Kamu sekarang jadi DJ 🎧");
                    } else if (s.dj) {
                        toast(
                            `DJ saat ini: ${s.dj.displayName || s.dj.username}`,
                            "warn",
                        );
                        return;
                    } else {
                        toast(
                            s.hasTrack
                                ? "Cuma peminta lagu yang sedang diputar yang bisa ambil DJ."
                                : "Putar lagu dulu untuk ambil DJ.",
                            "warn",
                        );
                        return;
                    }
                } catch (e) {
                    toast(e.message, true);
                }
                loadDJ();
            };
            drawDJ();

            // ================= SYNC DENGAN BOT =================
            // Peringatan di atas halaman: beda voice / belum masuk voice
            function applyVoiceLock(vm, noVoice) {
                const mode = vm ? "diff" : noVoice ? "none" : "";
                document.body.classList.toggle("lock-voice", !!mode);
                $("voiceBanner").style.display = mode ? "" : "none";

                // Sembunyikan control bar jika terkunci (beda voice / belum masuk voice)
                if (mode) {
                    $("dock").classList.remove("show");
                    document.body.classList.remove("has-dock");
                } else {
                    $("dock").classList.add("show");
                    document.body.classList.add("has-dock");
                }

                const sub = $("vbSub");
                sub.textContent = "";
                if (mode === "diff") {
                    $("vbTitle").textContent = "Kamu beda voice dengan bot";
                    const b = document.createElement("b");
                    b.textContent = vm.name;
                    sub.append("Masuk ke 🔊 ", b, " untuk mengontrol musik.");
                } else if (mode === "none") {
                    $("vbTitle").textContent =
                        "Kamu belum ada di voice channel";
                    sub.textContent =
                        "Masuk ke voice channel Discord dulu supaya dashboard bisa mengontrol bot.";
                }
            }

            async function loadQueue() {
                if (dragging || pendingDrag) return;
                const t0 = performance.now();
                let d;
                try {
                    d = await api("/api/queue");
                } catch (e) {
                    showStatus(friendly(e.message));
                    if (!track) {
                        setIdle(friendly(e.message));
                        if (queueSig === null) {
                            qData = [];
                            queueSig = "";
                            renderQueue();
                        }
                    }
                    return;
                }
                if (!d || dragging || pendingDrag) return;
                // cek ulang setelah await (user bisa mulai drag selama fetch)
                if (dragging || pendingDrag) return;
                const p = d.playing;
                showStatus(
                    d.error && !/voice channel/i.test(d.error)
                        ? friendly(d.error)
                        : "",
                );
                const noVoice = !!d.error && /voice channel/i.test(d.error);
                applyVoiceLock(d.voiceMismatch || null, noVoice);
                if (p) {
                    $("dock").classList.remove("idle");
                    setBarColor(p.color || null);
                    ["pp", "skip", "auto", "loop"].forEach(
                        (id) => ($(id).disabled = false),
                    );
                    const changed =
                        !track || track.id !== p.id || track.title !== p.title;
                    track = p;
                    dur = p.durationMS;
                    $("tot").textContent = fmt(dur);
                    $("pbar").setAttribute(
                        "aria-valuemax",
                        Math.floor(dur / 1000),
                    );
                    if (changed) {
                        $("cover").src = p.thumbnail || "";
                        $("cover").style.display = p.thumbnail ? "" : "none";
                        $("coverPh").style.display = p.thumbnail ? "none" : "";
                        $("title").textContent = p.title;
                        $("author").textContent = p.author;
                        $("bg").style.backgroundImage = p.thumbnail
                            ? `url("${p.thumbnail}")`
                            : "none";
                        document.title = "▶ " + p.title;
                        setAnchor(p.progress);
                        holdUntil = 0;
                        pushRecent(p);
                    }
                    // nama requester ikut realtime (nickname berubah → langsung ganti)
                    const isAuto = !p.requestedBy;
                    const reqKey = isAuto ? "AUTO" : p.requestedBy;
                    if (reqKey !== reqShown) {
                        reqShown = reqKey;
                        const rb = $("reqby");
                        rb.textContent = "";
                        if (isAuto) {
                            rb.append("Autoplay");
                        } else {
                            rb.append("Requested by  ");
                            const tg = document.createElement("span");
                            tg.className = "tag req";
                            tg.textContent = "@" + p.requestedBy;
                            rb.append(tg);
                        }
                        rb.style.display = "";
                    }
                    if (Date.now() > holdUntil && !scrubbing) {
                        const wasPaused = paused;
                        setPaused(p.isPaused);
                        loopMode = d.loopMode > 2 ? 0 : d.loopMode || 0;
                        drawLoop();
                        autoplay = !!d.autoplay;
                        drawAuto();
                        // saat pause tidak perlu kompensasi latency
                        const srv = p.isPaused
                            ? p.progress
                            : p.progress + (performance.now() - t0) / 2;
                        // status pause berubah -> ikut server; selain itu koreksi hanya jika melenceng > 1 dtk
                        if (
                            wasPaused !== p.isPaused ||
                            Math.abs(srv - now()) > 1000
                        )
                            setAnchor(srv);
                    }
                } else {
                    setIdle(d.error ? friendly(d.error) : undefined);
                    document.title = "Discord Music Remote";
                }

                const sig = (d.queue || [])
                    .map((t) => t.id + (t.requestedBy || ""))
                    .join("|");
                if (sig !== queueSig) {
                    queueSig = sig;
                    qData = d.queue || [];
                    renderQueue();
                }
            }

            // ================= ANTRIAN + DRAG & DROP =================
            const qList = $("queue");

            function renderQueue() {
                $("qcount").textContent = qData.length
                    ? qData.length + " lagu"
                    : "";
                $("qhint").style.display = qData.length > 1 ? "block" : "none";
                if (!qData.length) {
                    qList.innerHTML = `<div class="empty">${autoplay ? "Antrian kosong — autoplay akan menyiapkan lagu berikutnya 🎶" : "Antrian kosong..."}</div>`;
                    return;
                }
                qList.innerHTML = qData
                    .map(
                        (t, i) => `
    <div class="row q-row" data-id="${esc(t.id)}" data-color="${esc(t.color || "")}" tabindex="0" aria-label="${esc(t.title)}, urutan ${i + 1}. Alt + panah atas atau bawah untuk memindahkan">
      <span class="grip" title="Tarik untuk mengubah urutan">${ICON.grip}</span>
      <span class="idx">${i + 1}</span>
      ${t.thumbnail ? `<img src="${esc(t.thumbnail)}" alt="" draggable="false">` : '<div class="ph">🎵</div>'}
      <div class="meta"><div class="t">${esc(t.title)}</div><div class="a">${esc(t.author)}</div><div class="a qtags">${t.auto ? '<span class="tag auto">AUTO</span>' : ""}<span class="tag ${t.ytSource ? "youtube" : "music"}">${t.ytSource ? SRC.youtube : SRC.music}</span>${t.requestedBy ? `<span class="tag req">@${esc(t.requestedBy)}</span>` : ""}</div></div>
      <span class="dur">${esc(t.duration || "")}</span>
      <div class="acts">
        <button class="ib" data-a="jump" title="Putar sekarang">▶</button>
        <button class="ib x" data-a="rm" title="Hapus">${ICON.x}</button>
      </div>
    </div>`,
                    )
                    .join("");
                // siapkan warna cover untuk drag & terapkan ke badge nama requester
                const reqBadges = {};
                qList.querySelectorAll(".tag.req").forEach((b) => {
                    const id = b.closest(".q-row").dataset.id;
                    if (id) reqBadges[id] = b;
                });
                qData.forEach((t) => {
                    if (t.thumbnail) {
                        const applyColor = (hex) => {
                            if (!hex) return;
                            const badge = reqBadges[t.id];
                            if (badge) {
                                badge.style.setProperty(
                                    "--req-color",
                                    `color-mix(in srgb, ${tint(hex)} 35%, #fff)`,
                                );
                                badge.style.setProperty(
                                    "--req-bg",
                                    hexA(hex, 0.22),
                                );
                            }
                        };
                        const cached = _colorCache.get(t.thumbnail);
                        if (cached) applyColor(cached);
                        else getCoverColor(t.thumbnail).then(applyColor);
                    }
                });
            }

            qList.addEventListener("click", async (e) => {
                const b = e.target.closest("[data-a]");
                if (!b) return;
                const row = b.closest(".q-row"),
                    i = [...qList.children].indexOf(row),
                    id = row.dataset.id;
                try {
                    if (b.dataset.a === "jump" && paused) {
                        setPaused(false); // server akan auto-resume saat jump
                        holdUntil = Date.now() + 2500;
                    }
                    await api(
                        b.dataset.a === "jump"
                            ? "/api/queue/jump"
                            : "/api/queue/remove",
                        { index: i, id },
                    );
                    if (b.dataset.a === "rm")
                        toast("Lagu dihapus dari antrian");
                } catch (err) {
                    toast(err.message, 1);
                }
                queueSig = null;
                loadQueue();
            });

            // FLIP: baris lain meluncur halus ke posisi barunya saat urutan berubah
            // Pakai Web Animations (transform saja, jalan di GPU) -> ringan & tidak saling bentrok
            function reflow(mutate) {
                const kids = [...qList.children].filter(
                        (k) => !k.classList.contains("dragging"),
                    ),
                    first = new Map(
                        kids.map((k) => [k, k.getBoundingClientRect().top]),
                    );
                mutate();
                for (const k of kids)
                    k.getAnimations().forEach((an) => an.cancel());
                for (const k of kids) {
                    const dy = first.get(k) - k.getBoundingClientRect().top;
                    if (!dy) continue;
                    k.animate(
                        [
                            { transform: `translateY(${dy}px)` },
                            { transform: "translateY(0)" },
                        ],
                        {
                            duration: 280,
                            easing: "cubic-bezier(0.22, 1, 0.36, 1)",
                        },
                    );
                }
            }
            const renumber = () =>
                [...qList.children].forEach((c, i) => {
                    const n = c.querySelector(".idx");
                    if (n) n.textContent = i + 1;
                });

            async function commitMove(from, to, id) {
                const snapshot = qData.slice();
                const [m] = qData.splice(from, 1);
                qData.splice(to, 0, m);
                queueSig = qData.map((t) => t.id).join("|");
                try {
                    await api("/api/queue/move", { from, to, id });
                    toast("Urutan diperbarui");
                } catch (err) {
                    toast(err.message, 1);
                    // rollback ke snapshot supaya UI tidak nyangkut di urutan palsu
                    qData = snapshot;
                    queueSig = null;
                    renderQueue();
                }
            }

            // ================= EKSTRAK WARNA DOMINAN DARI COVER =================
            // Pakai Image terpisah dengan crossOrigin="anonymous" supaya canvas tidak "tainted"
            // (sebelumnya getImageData gagal diam-diam, jadi warna tidak pernah terpakai).
            const _colorCache = new Map(); // url -> hex | null
            const _colorPending = new Map();

            function extractColor(img) {
                try {
                    const size = 40;
                    const c = document.createElement("canvas");
                    c.width = c.height = size;
                    const ctx = c.getContext("2d", {
                        willReadFrequently: true,
                    });
                    ctx.drawImage(img, 0, 0, size, size);
                    const data = ctx.getImageData(0, 0, size, size).data;
                    const buckets = {};
                    let aR = 0,
                        aG = 0,
                        aB = 0,
                        aN = 0;
                    for (let i = 0; i < data.length; i += 4) {
                        if (data[i + 3] < 128) continue;
                        const r = data[i],
                            g = data[i + 1],
                            b = data[i + 2];
                        aR += r;
                        aG += g;
                        aB += b;
                        aN++;
                        const mx = Math.max(r, g, b),
                            mn = Math.min(r, g, b);
                        const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                        if (lum < 28 || lum > 235) continue; // buang hitam/putih (termasuk bar hitam thumbnail)
                        const sat = mx ? (mx - mn) / mx : 0;
                        const key = `${Math.round(r / 24) * 24},${Math.round(g / 24) * 24},${Math.round(b / 24) * 24}`;
                        const k =
                            buckets[key] ||
                            (buckets[key] = { n: 0, s: 0, r: 0, g: 0, b: 0 });
                        // warna yang lebih "hidup" (saturasi tinggi) diberi bobot lebih
                        const w = 0.25 + sat;
                        k.n += w;
                        k.s += sat;
                        k.r += r * w;
                        k.g += g * w;
                        k.b += b * w;
                    }
                    let best = null;
                    for (const k of Object.values(buckets))
                        if (!best || k.n > best.n) best = k;
                    if (!best) {
                        if (!aN) return null;
                        const h = (v) =>
                            Math.round(v / aN)
                                .toString(16)
                                .padStart(2, "0");
                        return "#" + h(aR) + h(aG) + h(aB);
                    }
                    const to = (v) =>
                        Math.round(v / best.n)
                            .toString(16)
                            .padStart(2, "0");
                    return "#" + to(best.r) + to(best.g) + to(best.b);
                } catch {
                    return null;
                }
            }

            async function fetchCoverColor(url) {
                // Selalu gunakan proxy lokal agar terhindar dari blokir CORS
                try {
                    const proxyUrl =
                        "/api/proxy-image?url=" + encodeURIComponent(url);
                    const r = await fetch(proxyUrl);
                    if (!r.ok) throw new Error("Proxy failed");

                    const bmp = await createImageBitmap(await r.blob());
                    return extractColor(bmp);
                } catch {
                    return null; // Jika gagal (misal gambar diblokir), abaikan
                }
            }

            function getCoverColor(url) {
                if (!url) return Promise.resolve(null);
                if (_colorCache.get(url))
                    return Promise.resolve(_colorCache.get(url));
                if (_colorPending.has(url)) return _colorPending.get(url);
                const p = fetchCoverColor(url).then((hex) => {
                    if (hex) _colorCache.set(url, hex); // yang gagal tidak di-cache, boleh dicoba lagi
                    _colorPending.delete(url);
                    return hex;
                });
                _colorPending.set(url, p);
                return p;
            }

            function hexA(hex, alpha) {
                const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(
                    hex || "",
                );
                if (!m) return `rgba(88,101,242,${alpha})`;
                const [r, g, b] = m.slice(1).map((v) => parseInt(v, 16));
                return `rgba(${r},${g},${b},${alpha})`;
            }

            // Mouse: tarik di mana saja pada baris. Sentuhan: tarik lewat handle (⋮⋮) supaya scroll tetap normal.
            qList.addEventListener("pointerdown", (e) => {
                if (e.button > 0 || dragging || pendingDrag) return;
                const el = e.target.closest(".q-row");
                if (!el || e.target.closest(".acts")) return;
                if (e.pointerType !== "mouse" && !e.target.closest(".grip"))
                    return;
                e.preventDefault();

                // 👇 Set flag SEGERA supaya loadQueue tidak menimpa DOM saat drag
                pendingDrag = true;
                const releaseIfNoDrag = () => {
                    if (pendingDrag) {
                        pendingDrag = false;
                        dragging = false;
                    }
                };
                // timeout: kalau tidak ada gerakan dalam 400ms, anggap klik biasa
                const noDragTimer = setTimeout(releaseIfNoDrag, 400);

                const from = [...qList.children].indexOf(el),
                    id = el.dataset.id;
                const startY = e.clientY,
                    grab = e.clientY - el.getBoundingClientRect().top;
                let started = false,
                    finished = false,
                    y = e.clientY,
                    raf = 0,
                    lastTop = null,
                    vel = 0;
                el.setPointerCapture(e.pointerId);
                // feedback "ditekan" sebelum mulai drag
                el.classList.add("pressing");
                el.style.transition =
                    "transform .18s cubic-bezier(0.22, 1, 0.36, 1), background-color .18s";
                let t0 = 0,
                    curColor = null;

                // Warna background drag = warna dominan cover art lagu ini
                const tr = qData[from] || {};
                const applyColor = (hex) => {
                    if (!hex) return;
                    el.style.setProperty("--drag-bg", hexA(hex, 0.28));
                };
                const known =
                    tr.color ||
                    el.dataset.color ||
                    _colorCache.get(tr.thumbnail);
                if (known) applyColor(known);
                else getCoverColor(tr.thumbnail).then(applyColor);

                const place = () => {
                    const lr = qList.getBoundingClientRect();
                    const want = y - grab - lr.top;

                    // tentukan posisi sisip berdasarkan titik tengah baris yang ditarik
                    const mid = want + el.offsetHeight / 2;
                    const siblings = [...qList.children].filter(
                        (c) => c !== el,
                    );
                    const before =
                        siblings.find(
                            (c) => mid < c.offsetTop + c.offsetHeight / 2,
                        ) || null;
                    if (before !== el.nextElementSibling) {
                        reflow(() => qList.insertBefore(el, before));
                        vibrate(6);
                    }

                    // miring tipis mengikuti kecepatan tarikan + sedikit membesar
                    if (lastTop === null) lastTop = want;
                    vel += (want - lastTop - vel) * 0.25;
                    lastTop = want;
                    const k = Math.min(1, (performance.now() - t0) / 280),
                        lift = 1 - Math.pow(1 - k, 3); // easeOutCubic (tanpa bounce)
                    const tilt =
                        Math.max(-2.4, Math.min(2.4, vel * 0.2)) *
                        Math.min(1, lift);
                    el.style.transform = `translateY(${want - el.offsetTop}px) scale(${1 + 0.045 * lift}) rotate(${tilt}deg)`;
                };
                const tick = () => {
                    // auto-scroll yang lebih lembut & progresif
                    const edgeTop = 90,
                        edgeBot = 210;
                    if (y < edgeTop) {
                        const p = (edgeTop - y) / edgeTop;
                        scrollBy(0, -Math.max(2, p * p * 22));
                    } else if (innerHeight - y < edgeBot) {
                        const p = (edgeBot - (innerHeight - y)) / edgeBot;
                        scrollBy(0, Math.max(2, p * p * 22));
                    }
                    place();
                    raf = requestAnimationFrame(tick);
                };
                const move = (ev) => {
                    y = ev.clientY;
                    if (started || Math.abs(y - startY) < 4) return;
                    started = true;
                    dragging = true;
                    pendingDrag = false;
                    clearTimeout(noDragTimer);
                    t0 = performance.now();
                    el.style.transition =
                        "background-color .25s, border-color .25s";
                    el.classList.add("dragging");
                    document.body.classList.add("is-dragging");
                    vibrate(10);
                    raf = requestAnimationFrame(tick);
                };
                const end = async () => {
                    finished = true;
                    clearTimeout(noDragTimer);
                    pendingDrag = false;
                    el.removeEventListener("pointermove", move);
                    el.removeEventListener("pointerup", end);
                    el.removeEventListener("pointercancel", end);
                    cancelAnimationFrame(raf);
                    el.classList.remove("pressing");
                    if (!started) {
                        el.style.transition = "";
                        dragging = false; // <-- pastikan flag lepas
                        return;
                    }
                    document.body.classList.remove("is-dragging");
                    el.classList.remove("dragging");
                    // animasi drop: meluncur halus ke slot sambil mengecil ke ukuran normal (tanpa bounce)
                    const cur =
                        el.style.transform ||
                        "translateY(0px) scale(1) rotate(0deg)";
                    el.style.transition = "background-color .28s ease-out";
                    el.style.transform = "";
                    el.animate(
                        [
                            { transform: cur },
                            {
                                transform:
                                    "translateY(0px) scale(1) rotate(0deg)",
                            },
                        ],
                        {
                            duration: 220,
                            easing: "cubic-bezier(0.22, 1, 0.36, 1)",
                        },
                    );
                    setTimeout(() => {
                        el.style.transition = "";
                        el.style.removeProperty("--drag-bg");
                    }, 300);
                    const to = [...qList.children].indexOf(el);
                    renumber();
                    try {
                        if (to !== from) await commitMove(from, to, id);
                    } catch (e) {
                        toast(e.message || "Gagal memindahkan lagu", 1);
                        qData = qData.slice();
                        renderQueue();
                    } finally {
                        dragging = false;
                        loadQueue();
                    }
                };
                el.addEventListener("pointermove", move);
                el.addEventListener("pointerup", end);
                el.addEventListener("pointercancel", end);
            });

            // Keyboard: Alt + ↑ / ↓ untuk memindahkan lagu yang sedang difokus
            qList.addEventListener("keydown", (e) => {
                const el = e.target.closest(".q-row");
                if (
                    !el ||
                    e.target !== el ||
                    !e.altKey ||
                    dragging ||
                    !/^Arrow(Up|Down)$/.test(e.key)
                )
                    return;
                e.preventDefault();
                const from = [...qList.children].indexOf(el),
                    up = e.key === "ArrowUp",
                    to = from + (up ? -1 : 1);
                if (to < 0 || to >= qList.children.length) return;
                dragging = true;
                // efek "nudge" kecil di baris yang dipindah
                el.style.transition =
                    "transform .3s cubic-bezier(0.34,1.56,0.64,1)";
                el.style.transform = "scale(1.03)";
                setTimeout(() => (el.style.transform = ""), 160);
                reflow(() =>
                    qList.insertBefore(
                        el,
                        up
                            ? el.previousElementSibling
                            : el.nextElementSibling.nextElementSibling,
                    ),
                );
                renumber();
                el.focus();
                commitMove(from, to, el.dataset.id).finally(() => {
                    dragging = false;
                    loadQueue();
                });
            });

            // ================= RECENT (terakhir diputar, disimpan per akun di browser) =================
            const isYt = (u) => /(?:youtube\.com|youtu\.be)\//i.test(u || "");
            const rkey = () => "mr_recent_" + uid;
            function loadRecent() {
                try {
                    recent = JSON.parse(
                        localStorage.getItem(rkey()) || "[]",
                    ).filter((x) => x && x.url && x.title);
                } catch {
                    recent = [];
                }
                renderRecent();
            }
            function saveRecent() {
                try {
                    localStorage.setItem(rkey(), JSON.stringify(recent));
                } catch {}
            }
            function pushRecent(p) {
                if (!p || !p.url) return;
                const item = {
                    title: p.title,
                    artist: p.author || "",
                    thumbnail: p.thumbnail || null,
                    duration: fmt(p.durationMS),
                    url: p.url,
                    requestedBy: p.requestedBy || null,
                };
                // ingat jalur aslinya: "youtube" (/yt) atau "music" (/play), supaya autoplay-nya ikut
                if (typeof p.ytSource === "boolean")
                    item.src = p.ytSource ? "youtube" : "music";
                recent = [
                    item,
                    ...recent.filter((x) => x.url !== item.url),
                ].slice(0, 30);
                saveRecent();
                renderRecent();
            }
            function renderRecent() {
                const list = recentOpen ? recent : recent.slice(0, 6);
                $("recentList").innerHTML = list
                    .map(
                        (r, i) => `
    <div class="row">
      ${r.thumbnail ? `<img src="${esc(r.thumbnail)}" alt="" loading="lazy">` : '<div class="ph">🎵</div>'}
      <div class="meta">
        <div class="t">${esc(r.title)}</div>
        <div class="a">${esc(r.artist)}</div>
        <div class="a qtags">
          <span class="tag ${r.src === "youtube" ? "youtube" : "music"}">${r.src === "youtube" ? SRC.youtube : SRC.music}</span>
        </div>
      </div>
      <span class="dur">${esc(r.duration || "")}</span>
      <button class="ib" data-r="${i}" title="Tambah ke antrian" aria-label="Tambah ${esc(r.title)} ke antrian">${ICON.plus}</button>
    </div>`,
                    )
                    .join("");
                const more = $("recentMore");
                more.style.display = recent.length > 6 ? "" : "none";
                more.textContent = recentOpen
                    ? "Sembunyikan"
                    : `Lihat semua (${recent.length})`;
                syncRecent();
            }
            // Recent hanya tampil kalau tidak ada hasil pencarian di layar
            function syncRecent() {
                $("recent").style.display =
                    recent.length && !$("results").childElementCount
                        ? "block"
                        : "none";
            }
            $("recentList").addEventListener("click", (e) => {
                const b = e.target.closest("[data-r]");
                if (!b) return;
                const r = recent[b.dataset.r];
                if (r)
                    playInput(
                        r.url,
                        r.src === "youtube" ? "youtube" : "music",
                        b,
                    );
            });
            $("recentMore").onclick = () => {
                recentOpen = !recentOpen;
                renderRecent();
            };
            $("recentClear").onclick = () => {
                recent = [];
                saveRecent();
                renderRecent();
                toast("Riwayat dihapus");
            };

            // ================= PENCARIAN (satu kotak, algoritma = /play + /yt) =================
            const PAGE = 24; // jumlah hasil per "halaman"
            let results = [],
                filter = "all",
                shown = PAGE,
                searchSeq = 0;
            const isUrl = (s) => /^https?:\/\//i.test(s.trim());

            async function playInput(query, kind, btn) {
                // 👇 Cek apakah ini link Playlist/Album Spotify
                const isSpotifyPlaylist =
                    /open\.spotify\.com\/(playlist|album)/i.test(query);

                // Tampilkan toast loading jika ini playlist (karena butuh waktu agak lama)
                if (isSpotifyPlaylist) {
                    toast("Memuat lagu dari playlist Spotify... ⏳");
                }

                if (btn) btn.disabled = true;

                try {
                    const d = await api("/api/queue", { url: query, kind });
                    toast(
                        (d.title || "Lagu") +
                            " ditambahkan" +
                            (d.note ? " · " + d.note : ""),
                    );
                    queueSig = null;
                    loadQueue();
                } catch (e) {
                    toast(e.message, 1);
                }
                if (btn) btn.disabled = false;
            }

            async function search() {
                const q = $("q").value.trim();
                if (!q) return;
                if (isUrl(q)) return goBest(); // link → langsung putar
                const my = ++searchSeq; // hasil lama tidak boleh menimpa pencarian baru
                $("chips").style.display = "none";
                $("results").innerHTML = '<div class="skel"></div>'.repeat(4);
                syncRecent();
                if (window.innerWidth <= 760)
                    document.querySelector(".qbox").style.display = "none";
                $("seBtn").disabled = true;
                let data;
                try {
                    data = await api("/api/search?q=" + encodeURIComponent(q));
                } catch (e) {
                    if (my === searchSeq) {
                        $("results").innerHTML =
                            `<div class="empty">${esc(e.message)}</div>`;
                        if (window.innerWidth <= 760)
                            document.querySelector(".qbox").style.display = "";
                    }
                    return;
                } finally {
                    if (my === searchSeq) $("seBtn").disabled = false;
                }
                if (my !== searchSeq || !Array.isArray(data)) return;
                results = data;
                shown = PAGE;
                filter = "all";
                drawResults();
                if (window.innerWidth <= 760)
                    document.querySelector(".qbox").style.display = "";
            }

            function drawResults() {
                const present = [
                    "all",
                    ...new Set(results.map((r) => r.source)),
                ];
                $("chips").style.display = results.length ? "flex" : "none";
                $("chips").innerHTML = present
                    .map(
                        (s) =>
                            `<button class="chip ${s === filter ? "on" : ""}" data-f="${s}">${s === "all" ? "Semua" : SRC[s]}</button>`,
                    )
                    .join("");
                const all = results
                    .map((r, i) => ({ r, i }))
                    .filter((x) => filter === "all" || x.r.source === filter);
                const list = all.slice(0, shown);
                $("results").innerHTML = list.length
                    ? list
                          .map(
                              ({ r, i }) => `
    <div class="row">
      ${r.thumbnail ? `<img src="${esc(r.thumbnail)}" alt="" loading="lazy">` : '<div class="ph">🎤</div>'}
      <div class="meta"><div class="t">${esc(r.title)}</div><div class="a">${esc(r.artist)}</div><div class="a qtags"><span class="tag ${r.source}">${SRC[r.source] || ""}</span></div></div>
      <span class="dur">${esc(r.duration || "")}</span>
      <button class="ib" data-i="${i}" title="Tambah ke antrian" aria-label="Tambah ke antrian">${ICON.plus}</button>
    </div>`,
                          )
                          .join("") +
                      (all.length > list.length
                          ? `<button class="more" id="moreBtn">Tampilkan lebih banyak (${all.length - list.length} lagi)</button>`
                          : "")
                    : '<div class="empty">Tidak ada hasil 😕</div>';
                syncRecent();
            }
            $("chips").addEventListener("click", (e) => {
                const c = e.target.closest("[data-f]");
                if (c) {
                    filter = c.dataset.f;
                    shown = PAGE;
                    drawResults();
                }
            });
            $("results").addEventListener("click", (e) => {
                if (e.target.closest("#moreBtn")) {
                    shown += PAGE;
                    return drawResults();
                }
                const b = e.target.closest("[data-i]");
                if (!b) return;
                const r = results[b.dataset.i];
                // YouTube asli → jalur /yt, sisanya → jalur /play (lirik dikirim sebagai teks "artis judul")
                playInput(
                    r.url || r.query,
                    r.source === "youtube" ? "youtube" : "music",
                    b,
                );
            });

            // ⚡ Putar = persis perilaku /play: link/teks → hasil terbaik langsung masuk
            async function goBest() {
                const q = $("q").value.trim();
                if (!q) return;
                searchSeq++;
                $("seBtn").disabled = false;

                // Tentukan jenis input
                let kind = "music";
                if (/open\.spotify\.com/i.test(q)) kind = "spotify";
                else if (isYt(q)) kind = "youtube";

                await playInput(q, kind, $("seBtn"));

                $("q").value = "";
                $("q").dispatchEvent(new Event("input"));
                $("clearBtn").classList.remove("show");
                $("results").innerHTML = "";
                $("chips").style.display = "none";
                syncRecent();
            }
            $("seBtn").onclick = () => {
                // Jika input adalah URL, langsung putar/tambahkan (goBest)
                // Jika teks biasa, lakukan pencarian (search)
                if (isUrl($("q").value.trim())) {
                    goBest();
                } else {
                    search();
                }
            };

            $("clearBtn").onclick = () => {
                $("q").value = "";
                $("q").dispatchEvent(new Event("input"));
                $("q").focus();
            };
            $("q").addEventListener("input", () => {
                const val = $("q").value.trim();

                // 👇 Tombol X muncul kalau ada teks
                $("clearBtn").classList.toggle("show", !!$("q").value);

                // 👇 Logika ubah ikon jadi (+) jika input berupa URL apa saja (termasuk Spotify)
                if (isUrl(val)) {
                    $("seBtn").innerHTML = ICON.plus; // Ikon tambah
                    $("seBtn").title = "Tambahkan ke antrian";
                    $("seBtn").setAttribute(
                        "aria-label",
                        "Tambahkan ke antrian",
                    );
                } else {
                    $("seBtn").innerHTML = ICON.search; // Ikon search
                    $("seBtn").title = "Cari";
                    $("seBtn").setAttribute("aria-label", "Cari");
                }

                if (val) return;
                searchSeq++;
                results = [];
                $("results").innerHTML = "";
                $("chips").style.display = "none";
                $("seBtn").disabled = false;
                if (window.innerWidth <= 760)
                    document.querySelector(".qbox").style.display = "";
                syncRecent();
            });
            $("q").addEventListener("keydown", (e) => {
                if (e.key === "Enter") e.shiftKey ? goBest() : search();
            });
        </script>
    </body>
</html>
