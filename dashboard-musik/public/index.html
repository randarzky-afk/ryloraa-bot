        <style>
            @font-face {
                font-family: "SF Pro Display";
                src: url("/fonts/SF-Pro-Display-Regular.woff") format("woff");
                font-weight: 400;
                font-display: swap;
            }
            @font-face {
                font-family: "SF Pro Display";
                src: url("/fonts/SF-Pro-Display-Medium.woff") format("woff");
                font-weight: 500;
                font-display: swap;
            }
            @font-face {
                font-family: "SF Pro Display";
                src: url("/fonts/SF-Pro-Display-Semibold.woff") format("woff");
                font-weight: 600;
                font-display: swap;
            }
            @font-face {
                font-family: "SF Pro Display";
                src: url("/fonts/SF-Pro-Display-Bold.woff") format("woff");
                font-weight: 700;
                font-display: swap;
            }
            @font-face {
                font-family: "SF Pro Text";
                src: url("/fonts/SF-Pro-Text-Semibold.woff") format("woff");
                font-weight: 600;
                font-display: swap;
            }
            :root {
                --bg: #0b0b12;
                --panel: rgba(255, 255, 255, 0.055);
                --line: rgba(255, 255, 255, 0.09);
                --txt: #f2f2f7;
                --dim: #9a9aae;
                --acc: rgba(255, 255, 255, 0.062);
                --grn: #1ed760;
                --red: #ed4245;
                --glow: 88, 101, 242;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                background: var(--bg);
                color: var(--txt);
                font-family:
                    -apple-system, BlinkMacSystemFont, "SF Pro Display",
                    "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto,
                    system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                text-rendering: optimizeLegibility;
                letter-spacing: -0.01em;
                display: flex;
                justify-content: center;
                padding: 18px 14px 60px;

                /* 👇 Mencegah blok biru (highlight) di seluruh UI */
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
            }
            body.has-dock {
                padding-bottom: 130px;
            }
            body.is-dragging {
                cursor: grabbing;
                user-select: none;
                -webkit-user-select: none;
            }
            button {
                font-family: inherit;
            }
            .bg {
                position: fixed;
                inset: -40px;
                z-index: -1;
                background: center/cover;
                filter: blur(70px) saturate(1.2); /* Kurangi sedikit saturasi */
                opacity: 0.18; /* Diturunkan dari 0.35 agar lebih gelap & tidak menyilaukan */
                transition:
                    background-image 0.8s,
                    opacity 0.8s;
            }
            .wrap {
                width: 100%;
                max-width: 900px; /* Diperlebar agar 2 kolom muat dengan lega */
                transition: max-width 0.3s ease;
            }
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 18px;
            }
            h1 {
                font-size: 20px;
                margin: 0;
                letter-spacing: 0.2px;
            }
            .user {
                display: flex;
                align-items: center;
                gap: 10px;
                background: var(--panel);
                border: 1px solid var(--line);
                padding: 5px 6px 5px 5px;
                border-radius: 99px;
            }
            .user img {
                width: 30px;
                height: 30px;
                border-radius: 50%;
            }
            .user span {
                font-size: 14px;
                font-weight: 600;
            }
            .user svg {
                transform: translateX(-5px) translateY(0.5px);
            }
            .btn {
                border: 0;
                cursor: pointer;
                color: #fff;
                background: var(--acc);
                padding: 9px 18px;
                border-radius: 99px;
                font-weight: 700;
                font-size: 14px;
                text-decoration: none;
                transition: filter 0.15s;
            }
            .btn:hover:not(:disabled) {
                filter: brightness(1.15);
            }
            .btn.red {
                background: var(--red);
                padding: 6px 12px;
                font-size: 12px;
            }
            #main {
                display: none;
            }
            .glass {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 18px;
                backdrop-filter: blur(14px);
            }

            /* Layout 2 Kolom di Desktop */
            .main-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
                align-items: start;
            }
            .col-left,
            .col-right {
                min-width: 0;
                display: flex;
                flex-direction: column;
            }
            .col-right .qbox {
                margin-top: 0; /* Hilangkan margin-top karena posisinya sudah sejajar */
            }

            /* search */
            .search {
                display: flex;
                gap: 8px;
                padding: 8px;
                margin-bottom: 10px;
                transition: 0.2s;
            }
            .search:focus-within {
                border-color: rgba(
                    255,
                    255,
                    255,
                    0.2
                ); /* Warna border netral saat aktif */
            }
            .search input {
                flex: 1;
                min-width: 0;
                background: none;
                border: 0;
                outline: 0;
                color: var(--txt);
                font-size: 15px;
                padding: 8px 10px;
                font-family: inherit;
                letter-spacing: -0.01em;

                /* 👇 Izinkan copy-paste teks link di input */
                -webkit-user-select: text;
                user-select: text;
            }

            .go {
                background: var(--grn);
                color: #04210f;
            }
            .btn.se {
                display: grid;
                place-items: center;
                width: 40px;
                height: 40px;
                padding: 0;
                border-radius: 50%;
                flex: none;

                /* 👇 Default: transparan, teks abu-abu */
                background: transparent;
                color: var(--dim);
                transition:
                    background 0.2s,
                    color 0.2s;
            }

            /* 👇 Efek saat di-hover: background ikut warna cover art */
            .btn.se:hover:not(:disabled) {
                background: rgba(255, 255, 255, 0.082);
                color: #ffffff; /* Warna teks jadi gelap agar terbaca di background terang */
            }

            .btn.se:disabled {
                opacity: 0.6;
                cursor: default;
            }

            /* Tombol X hapus teks pencarian */
            /* Pembungkus input agar tombol X bisa mengapung di dalam */
            .search-input-wrap {
                position: relative;
                flex: 1;
                display: flex;
                align-items: center;
                min-width: 0;
            }
            .search-input-wrap input {
                width: 100%;
                padding-right: 40px !important; /* Beri ruang agar teks tidak nabrak tombol X */
            }

            /* Tombol X hapus teks pencarian */
            .btn.clear {
                display: none;
                position: absolute;
                right: 1px; /* Nempel ke kanan */
                top: 50%;
                transform: translateY(-50%);
                width: 28px;
                height: 28px;
                padding: 0;
                border-radius: 50%;
                background: transparent;
                color: var(--dim);
                cursor: pointer;
                border: 0;
                place-items: center;
                transition:
                    background 0.2s,
                    color 0.2s;
            }
            .btn.clear.show {
                display: grid;
            }
            .btn.clear:hover:not(:disabled) {
                color: #fff;
            }

            .chips {
                display: flex;
                gap: 6px;
                margin-bottom: 12px;
                flex-wrap: wrap;
            }
            .chip {
                border: 1px solid var(--line);
                background: none;
                color: var(--dim);
                padding: 5px 12px;
                border-radius: 99px;
                font-size: 12px;
                cursor: pointer;
            }
            .chip.on {
                background: var(--txt);
                color: #111;
                border-color: var(--txt);
            }
            .hint {
                font-size: 12px;
                color: var(--dim);
                margin: 0 4px 8px;
            }

            /* rows (hasil & antrian) */
            .row {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 8px 10px;
                border-radius: 12px;
                position: relative;
                transition: background-color 0.1s ease;
            }
            .row:hover {
                background: rgba(255, 255, 255, 0.06);
            }
            /* Efek scale dihilangkan, hanya highlight background yang tersisa */
            .row img,
            .ph {
                width: 48px;
                height: 48px;
                border-radius: 8px;
                object-fit: cover;
                flex: none;
                background: #222;
            }
            .ph {
                display: grid;
                place-items: center;
                font-size: 20px;
            }
            .meta {
                flex: 1;
                min-width: 0;
            }
            .t {
                font-weight: 600;
                font-size: 14px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .a {
                color: var(--dim);
                font-size: 12px;
                margin-top: 2px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            /* judul & artis di daftar (hasil cari, terakhir diputar, queue) tampil penuh */
            .row .t,
            .row .a {
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                white-space: normal;
                overflow-wrap: break-word;
                word-break: break-word;
                min-width: 0;
                line-height: 1.3;
            }

            .row .a {
                -webkit-line-clamp: 1;
            }
            .row .a .tag {
                white-space: nowrap;
            }
            .tag {
                font-size: 10px;
                padding: 1px 6px;
                border-radius: 5px;
                margin-right: 6px;
                font-weight: 700;
                background: rgba(var(--glow), 0.25);
            }
            .tag.youtube {
                background: rgba(237, 66, 69, 0.28);
            }
            .tag.spotify {
                background: rgba(30, 215, 96, 0.25);
            }
            .tag.lyric {
                background: rgba(250, 190, 40, 0.28);
            }
            .tag.auto {
                background: rgba(30, 215, 96, 0.22);
                color: var(--grn);
            }
            .tag.req {
                background: color-mix(
                    in srgb,
                    var(--np, #fff) 14%,
                    transparent
                );
                color: var(--np);
                margin-right: 0;
                transition:
                    background 0.6s,
                    color 0.6s;
                font-family: inherit;
                font-size: 14px; /* Samakan dengan ukuran .t */
                font-weight: 400; /* Samakan dengan ketebalan .t */
                border-radius: 20px;
            }
            /* queue: badge di bawah nama artis */
            .row .qtags {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 4px;
                margin-top: 3px;
            }
            .row .qtags .tag {
                margin-right: 0;
            }
            .row .tag.req {
                font-size: 11px;
                padding: 1px 8px;
                color: var(--req-color, var(--txt));
                background: var(--req-bg, rgba(255, 255, 255, 0.12));
                transition:
                    color 0.6s,
                    background 0.6s;
            }
            .dur {
                color: var(--dim);
                font-size: 12px;
                font-variant-numeric: tabular-nums;
            }
            .ib {
                border: 0;
                width: 34px;
                height: 34px;
                border-radius: 50%;
                background: transparent;
                color: rgba(255, 255, 255, 0.541);
                cursor: pointer;
                flex: none;
                font-size: 13px;
                display: grid;
                place-items: center;
                padding: 0;
                transition: background 0.1s;
            }
            .ib:hover:not(:disabled) {
                color: white;
                background: var(--acc);
            }
            .ib.x {
                color: #fff; /* Pastikan ikon berwarna putih */
            }
            .ib.x:hover:not(:disabled) {
                background: var(--red);
                color: #fff;
            }
            .ib:disabled {
                opacity: 0.5;
                cursor: default;
            }
            .skel {
                height: 64px;
                border-radius: 12px;
                margin-bottom: 6px;
                background: linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.04),
                    rgba(255, 255, 255, 0.1),
                    rgba(255, 255, 255, 0.04)
                );
                background-size: 200% 100%;
                animation: sh 1.2s infinite;
            }
            @keyframes sh {
                to {
                    background-position: -200% 0;
                }
            }

            /* queue */
            .qbox {
                padding: 12px 8px 8px;
                margin-top: 22px;
            }
            .qh {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                margin: 0 8px 4px;
            }
            .qh h3 {
                margin: 0;
                font-size: 16px;
            }
            .qh small {
                color: var(--dim);
            }
            .qbox .hint {
                margin: 0 8px 8px;
            }
            #queue {
                position: relative;
            }
            .q-row {
                touch-action: pan-y;
                outline: 0;
            }
            .q-row:focus-visible {
                box-shadow: 0 0 0 2px var(--acc);
            }
            @media (hover: hover) and (pointer: fine) {
                .q-row {
                    cursor: grab;
                }
            }
            .grip {
                color: var(--dim);
                padding: 8px 4px;
                touch-action: none;
                user-select: none;
                flex: none;
                display: grid;
                place-items: center;
                cursor: grab;
                border-radius: 8px;
                transition:
                    color 0.2s,
                    background 0.2s,
                    transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .q-row:hover .grip {
                color: var(--txt);
                background: rgba(255, 255, 255, 0.06);
            }
            .q-row:hover .grip svg {
                animation: iconBounce 0.2s ease-out;
            }
            .grip:active {
                transform: scale(0.9);
            }
            .idx {
                width: 18px;
                text-align: center;
                color: var(--dim);
                font-size: 12px;
                flex: none;
                font-variant-numeric: tabular-nums;
            }
            .q-row {
                transition:
                    background 0.2s,
                    transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
                    box-shadow 0.28s;
                will-change: transform;
            }
            .q-row.pressing {
                transform: scale(0.982);
                background-color: rgba(255, 255, 255, 0.07);
            }
            .q-row.dragging {
                z-index: 50;
                /* warna dari cover art (di-set lewat JS) */
                background-color: var(--drag-bg, rgba(255, 255, 255, 0.1));
                border: 1px solid transparent;
                box-shadow: none;
                cursor: grabbing;
                transition:
                    background-color 0.25s,
                    border-color 0.25s,
                    box-shadow 0.25s;
                border-radius: 12px;
            }
            /* baris lain meredup sedikit supaya fokus ke yang ditarik */
            .q-row:not(.dragging) {
                transition:
                    background 0.2s,
                    transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
                    box-shadow 0.28s,
                    opacity 0.2s;
            }
            body.is-dragging .q-row:not(.dragging) {
                opacity: 0.55;
            }
            body.is-dragging .q-row.dragging .grip {
                color: #fff;
            }
            body.is-dragging .q-row.dragging .idx {
                color: #fff;
                font-weight: 700;
            }
            .q-row img {
                pointer-events: none;
                -webkit-user-drag: none;
            }
            .more {
                display: block;
                width: 100%;
                margin: 10px 0 4px;
                padding: 11px;
                border: 1px solid var(--line);
                border-radius: 12px;
                background: var(--panel);
                color: var(--dim);
                font: inherit;
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
                transition:
                    color 0.2s,
                    background 0.2s;
            }
            .more:hover {
                color: var(--txt);
                background: rgba(255, 255, 255, 0.09);
            }
            .empty {
                text-align: center;
                color: var(--dim);
                padding: 26px 12px;
                font-size: 14px;
                line-height: 1.5;
            }
            /* Semua list (antrian, hasil, recent): tombol muncul dengan transisi 0.2s saat hover */
            @media (hover: hover) {
                .row .acts,
                .row > .ib {
                    opacity: 0;
                    pointer-events: none;
                    transition:
                        opacity 0.1s ease,
                        background 0.1s ease;
                }
                .row:hover .acts,
                .row:focus-within .acts,
                .row:hover > .ib,
                .row:focus-within > .ib {
                    opacity: 1;
                    pointer-events: auto;
                }
            }
            .acts {
                display: flex;
                gap: 6px;
            }
            /* saat drag: tombol play & hapus disembunyikan di semua baris */
            body.is-dragging .q-row .acts {
                opacity: 0;
                pointer-events: none;
            }
            /* sembunyikan text hint saat drag biar fokus */
            body.is-dragging .qhint,
            body.is-dragging .q-status {
                opacity: 0;
                transition: opacity 0.15s;
            }

            /* dock player (Seperti Spotify) */
            .dock {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 20;
                display: none;
                grid-template-columns: minmax(0, 1fr) minmax(
                        300px,
                        560px
                    ) minmax(0, 1fr);
                align-items: stretch; /* Ubah dari center ke stretch */
                gap: 20px;
                padding: 12px 24px calc(12px + env(safe-area-inset-bottom, 0px));
                background: rgba(12, 12, 20, 0.82);
                backdrop-filter: blur(24px) saturate(1.5);
                -webkit-backdrop-filter: blur(24px) saturate(1.5);
                border-top: 1px solid var(--line);
            }
            .dock.show {
                display: grid;
            }
            .d-info {
                display: flex;
                align-items: center;
                justify-content: flex-start;
                gap: 12px;
                min-width: 0;
            }
            .d-info img {
                width: 56px;
                height: 56px;
                border-radius: 10px;
                object-fit: cover;
                flex: none;
                background: #222;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
            }
            .d-info .t {
                font-size: 14px;
            }
            .d-info .ph {
                width: 56px;
                height: 56px;
                border-radius: 10px;
                display: grid;
                place-items: center;
                font-size: 24px;
            }
            .meta {
                flex: 1;
                min-width: 0;
            }
            .btns {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
            }
            .btns-side {
                display: flex;
                align-items: center;
                gap: 8px;
                flex: 1; /* Membagi rata ruang kiri dan kanan */
            }
            .btns-side.left {
                justify-content: flex-end; /* Narik tombol ke arah tengah */
                padding-right: 12px; /* Jarak tombol infinity ke Pause */
            }
            .btns-side.right {
                justify-content: flex-start; /* Narik tombol ke arah tengah */
                padding-left: 12px; /* Jarak tombol skip ke Pause */
            }
            .dock.idle .pbar {
                opacity: 0.35;
                pointer-events: none;
            }

            .pp:disabled,
            .ic:disabled {
                opacity: 0.4;
                cursor: default;
                pointer-events: none;
            }
            .link {
                background: none;
                border: 1px solid rgba(255, 255, 255, 0.089);
                color: var(--dim);
                font-size: 12px;
                cursor: pointer;
                padding: 4px 8px;
                border-radius: 8px;
                transition: 0.2s;
            }
            .link:hover {
                color: var(--txt);
                background: rgba(255, 255, 255, 0.06);
            }
            .rbox {
                padding: 12px 8px 8px;
                margin-top: 6px;
            }
            .rbox .link.more {
                display: block;
                margin: 2px auto 4px;
            }
            .q-status {
                margin: 4px 8px 8px;
                padding: 10px 12px;
                border-radius: 12px;
                background: rgba(237, 66, 69, 0.14);
                border: 1px solid rgba(237, 66, 69, 0.4);
                font-size: 13px;
                line-height: 1.45;
            }
            .d-mid {
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 8px; /* Ubah jaraknya jadi lebih lega (misal 8px atau 10px) */
                min-width: 0;
                height: 100%;
            }
            .btns {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 10px;
            }

            .pp {
                width: 38px;
                height: 38px;
                border-radius: 50%;
                border: 0;
                background: #fff;
                color: #111;
                display: grid;
                place-items: center;
                cursor: pointer;
            }
            .ic {
                width: 42px;
                height: 42px;
                border-radius: 50%;
                border: 0;
                background: none;
                color: var(--dim);
                display: grid;
                place-items: center;
                cursor: pointer;
                position: relative;
                transition:
                    color 0.2s,
                    background 0.2s;
            }
            .ic:hover:not(:disabled) {
                color: var(--txt);
                background: rgba(255, 255, 255, 0.08);
            }
            .ic.on {
                color: var(--grn);
            }
            .ic.on::after {
                content: "";
                position: absolute;
                left: 50%;
                bottom: 3px;
                width: 4px;
                height: 4px;
                margin-left: -2px;
                border-radius: 50%;
                background: var(--grn);
            }
            .pp:focus-visible,
            .ic:focus-visible {
                outline: 2px solid #fff;
                outline-offset: 2px;
            }
            .d-mid {
                display: flex;
                flex-direction: column;
                gap: 2px;
                min-width: 0;
            }
            @media (min-width: 761px) {
                .d-mid {
                    flex-direction: column-reverse; /* Membalik urutan hanya untuk PC */
                    gap: 8px; /* Jarak yang pas untuk PC */
                }
            }
            .prog {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 11px;
                color: var(--dim);
                font-variant-numeric: tabular-nums;
            }
            .prog span {
                width: 34px;
                flex: none;
            }
            .prog span:first-child {
                text-align: right;
            }
            .pbar {
                position: relative;
                flex: 1;
                height: 20px;
                cursor: pointer;
                touch-action: none;
                display: flex;
                align-items: center;
                outline: 0;
            }
            .pbar .trk {
                width: 100%;
                height: 4px;
                border-radius: 5px;
                background: rgba(255, 255, 255, 0.18);
                position: relative;
                transition: height 0.15s;
            }
            .pbar:hover .trk,
            .pbar.drag .trk {
                height: 7px;
            }
            .fill {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 0;
                border-radius: 5px;
                background: var(--np, #fff);
                transition: background 0.6s;
            }
            .fill::after {
                content: "";
                position: absolute;
                right: -7px;
                top: 50%;
                width: 14px;
                height: 14px;
                margin-top: -7px;
                border-radius: 50%;
                background: #fff;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
                transform: scale(0);
                transition: transform 0.15s;
            }
            .pbar:hover .fill::after,
            .pbar.drag .fill::after,
            .pbar:focus-visible .fill::after {
                transform: scale(1);
            }
            .tip {
                position: absolute;
                bottom: 22px;
                transform: translateX(-50%);
                background: #000c;
                padding: 2px 7px;
                border-radius: 6px;
                font-size: 11px;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.12s;
                color: var(--txt);
            }
            .pbar:hover .tip,
            .pbar.drag .tip {
                opacity: 1;
            }

            #toasts {
                position: fixed;
                bottom: 18px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                flex-direction: column;
                gap: 8px;
                z-index: 50;
                align-items: center;
                pointer-events: none;
            }
            body.has-dock #toasts {
                bottom: 100px; /* 👈 Diubah dari 114px */
            }
            .toast {
                background: rgba(15, 15, 20, 0.5); /* Hitam transparan */
                border: 1px solid rgba(255, 255, 255, 0.08);
                padding: 10px 16px;
                border-radius: 12px;
                font-size: 13px;

                /* 👇 Hapus box-shadow */

                /* 👇 Posisi awal untuk animasi slide up */
                opacity: 0;
                transition: opacity 0.2s ease;
            }

            /* 👇 Class untuk memicu animasi muncul */
            .toast.show {
                opacity: 1;
                animation: kntl 0.2s;
            }

            @keyframes kntl {
                from {
                    transform: translateY(20px);
                }
                to {
                    from {
                        transform: translateY(0px);
                    }
                }
            }

            .toast.err {
                border-color: var(--red);
            }
            .toast.warn {
                border-color: #faa61a;
                background: rgba(42, 37, 26, 0.85);
            }
            /* Blok ini dihapus karena sudah diganti dengan transition */

            /* ===== Animasi ikon (simpel) ===== */
            @keyframes iconBounce {
                0% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.08);
                }
                100% {
                    transform: scale(1);
                }
            }
            @keyframes iconTap {
                0% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(0.92);
                }
                100% {
                    transform: scale(1);
                }
            }
            /* Tombol yang punya SVG: animasi hanya di ikon */
            .btn:hover:not(:disabled) svg,
            .btn.se:hover:not(:disabled) svg,
            .ic:hover:not(:disabled) svg,
            .pp:hover:not(:disabled) svg,
            .ib:hover:not(:disabled) svg {
                animation: iconBounce 0.2s ease-out;
            }
            .btn:active:not(:disabled) svg,
            .btn.se:active:not(:disabled) svg,
            .ic:active:not(:disabled) svg,
            .pp:active:not(:disabled) svg,
            .ib:active:not(:disabled) svg {
                animation: iconTap 0.15s ease-out;
            }

            .d-side {
                display: flex;
                justify-content: flex-end;
                align-items: center;
                min-width: 0;
            }
            .ic.dj.can {
                color: #eb459e;
            }
            .ic.dj.mine {
                color: #eb459e;
                background: rgba(235, 69, 158, 0.14);
            }
            .ic.dj img {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                object-fit: cover;
                box-shadow: 0 0 0 2px #eb459e;
            }
            /* terkunci karena DJ mode (hak akses diatur DJ di Discord) */
            body.lock-control #auto,
            body.lock-control #pp,
            body.lock-control #skip,
            body.lock-control #loop,
            body.lock-control #pbar,
            body.lock-control #queue [data-a="jump"],
            body.lock-queue #queue [data-a="rm"],
            body.lock-request .search,
            body.lock-request #results {
                opacity: 0.4;
                cursor: not-allowed;
            }
            .ic.dj:disabled {
                opacity: 0.35;
                cursor: not-allowed;
            }

            /* ===== beda voice dengan bot ===== */
            .voice-banner {
                grid-column: 1 / -1;
                padding: 14px 16px;
                border-radius: 16px;
                background: rgba(237, 66, 69, 0.14);
                border: 1px solid rgba(237, 66, 69, 0.45);
                line-height: 1.45;
            }
            .voice-banner .vb-t {
                font-weight: 700;
                font-size: 14px;
            }
            .voice-banner .vb-s {
                font-size: 13px;
                color: var(--dim);
                margin-top: 2px;
            }
            .voice-banner .vb-s b {
                color: var(--txt);
            }
            @media (max-width: 760px) {
                .voice-banner {
                    margin-bottom: 12px;
                }
                .prog {
                    margin-bottom: 5px;
                }
            }
            .col-left,
            .col-right,
            .d-mid {
                transition:
                    opacity 0.35s,
                    filter 0.35s;
            }
            body.lock-voice .col-left,
            body.lock-voice .col-right,
            body.lock-voice .d-mid {
                opacity: 0.32;
                filter: grayscale(1) brightness(0.55);
                pointer-events: none;
                cursor: not-allowed;
                user-select: none;
            }
            .djbox {
                display: none;
                align-items: center;
                gap: 10px;
                max-width: 100%;
                padding: 6px 16px 6px 6px;
                border-radius: 999px;
                background: rgba(235, 69, 158, 0.12);
                border: 1px solid rgba(235, 69, 158, 0.35);
            }
            .djbox.show {
                display: flex;
            }
            .djbox img {
                width: 34px;
                height: 34px;
                border-radius: 50%;
                object-fit: cover;
                flex: none;
            }
            .djbox .n {
                min-width: 0;
            }
            .djbox small {
                display: block;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: #eb459e;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .djbox b {
                display: block;
                font-size: 13px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            @media (max-width: 760px) {
                .q-row .idx,
                .row .dur {
                    display: none;
                }

                /* grip tetap tampil supaya bisa ditarik di HP, tapi dikecilkan */
                .q-row .grip {
                    padding: 6px 2px;
                }

                .q-row .grip svg {
                    width: 16px;
                    height: 16px;
                }

                .row {
                    padding: 6px 8px;
                    gap: 8px;
                }

                .row img,
                .row .ph {
                    width: 40px;
                    height: 40px;
                    border-radius: 6px;
                }

                .row .acts .ib {
                    width: 30px;
                    height: 30px;
                }

                .main-grid {
                    display: flex;
                    flex-direction: column;
                    gap: 0;
                    width: 100%;
                }

                /* Bongkar pembungkus kolom */
                .col-left,
                .col-right {
                    display: contents;
                }

                /* 👇 KUNCI UTAMA: Paksa semua kotak jadi sama lebar */
                .search,
                .qbox,
                .rbox {
                    width: 100% !important;
                    max-width: 100% !important;
                    box-sizing: border-box !important;
                    margin-left: 0 !important;
                    margin-right: 0 !important;
                }

                /* Urutan dari atas ke bawah */
                .search {
                    order: 1;
                    margin-bottom: 16px !important;
                }

                .chips {
                    order: 2;
                }
                #results {
                    order: 3;
                    margin-bottom: 16px;
                }

                .qbox {
                    order: 4;
                    margin-top: 0 !important;
                    margin-bottom: 16px !important;
                }

                .rbox {
                    order: 5;
                    margin-top: 0 !important;
                }

                /* Sisa CSS Mobile */
                body.has-dock {
                    padding-bottom: 240px;
                }
                body.has-dock #toasts {
                    bottom: 168px;
                }
                .dock {
                    grid-template-columns: minmax(0, 1fr);
                    gap: 6px;
                    padding: 10px 14px
                        calc(10px + env(safe-area-inset-bottom, 0px));
                }
                .dock > .d-side {
                    display: flex;
                    justify-content: center;
                }
                .dock > .d-side .djbox {
                    display: none !important;
                }
                .d-info img,
                .d-info .ph {
                    width: 44px;
                    height: 44px;
                }
                .user span {
                    display: none;
                }
            }

            /* ===== Nuansa tipografi iOS ===== */
            h1,
            .qh h3 {
                font-weight: 700;
                letter-spacing: -0.02em;
            }
            .t {
                font-weight: 600;
                letter-spacing: -0.01em;
            }
            .a,
            .hint,
            .dur,
            .idx {
                letter-spacing: 0;
            }
            button,
            .btn,
            .chip,
            .link {
                letter-spacing: -0.01em;
                -webkit-tap-highlight-color: transparent;
            }
            input::placeholder {
                letter-spacing: -0.01em;
            }
        </style>
    </head>
    <body>
        <div class="bg" id="bg"></div>
        <div class="wrap">
            <header>
                <h1>...</h1>
                <div id="userBox"></div>
            </header>

            <div id="main">
                <div class="main-grid">
                    <!-- PERINGATAN BEDA VOICE -->
                    <div

                    >

                        <div class="vb-s" id="vbSub"></div>

                    <!-- KOLOM KIRI: Pencarian & Riwayat -->
                    <div class="col-left">

                            <button

                                title="Cari"

                        ></div>

                        <section
                            class="glass rbox"
                            id="recent"
                            style="display: none"
                        >

                                <h3>Terakhir diputar</h3>
                                <button class="link" id="recentClear">
                                    Hapus riwayat
                                </button>
                            </div>
                            <div id="recentList"></div>
                            <button class="link more" id="recentMore"></button>

                    <!-- KOLOM KANAN: Antrian -->
                    <div class="col-right">

        <!-- Player bar di bawah -->
        <div class="dock" id="dock">
            <div class="d-info">
                <img id="cover" alt="" style="display: none" />
                <div class="ph" id="coverPh">🎵</div>
                <div class="meta">
                    <div class="t" id="title">-</div>
                    <div class="a" id="author">-</div>
                    <div class="a" id="reqby" style="display: none"></div>
                </div>
            </div>

            <div class="d-mid">
                <div class="prog">
                    <span id="cur">0:00</span>
                    <div
                        class="pbar"
                        id="pbar"
                        role="slider"
                        tabindex="0"
                        aria-label="Posisi lagu"
                        aria-valuemin="0"
                    >
                        <div class="trk">
                            <div class="fill" id="fill"></div>

                        <div class="tip" id="tip">0:00</div>

                </div>

                            class="ic"

                            title="Loop"
                            aria-pressed="false"

                    </div>

                        class="pp"
                        id="pp"

                    ></button>

            <div class="d-side">
